name: Build and Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_PREFIX: chatembed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push crawler
        uses: docker/build-push-action@v6
        with:
          context: ./python-crawlling-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crawler:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crawler:${{ steps.tags.outputs.short_sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./express-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.tags.outputs.short_sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tags.outputs.short_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /opt/chatembed
            git pull origin main

            # Login to DOCR
            doctl registry login --expiry-seconds 600

            # Pull latest images and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Run database migrations
            docker compose run --rm backend npx prisma migrate deploy

            # Cleanup old images
            docker image prune -f

            echo "✅ Deploy complete at $(date)"
