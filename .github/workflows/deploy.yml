name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_PREFIX: averto

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build and push crawler
        uses: docker/build-push-action@v6
        with:
          context: ./python-crawlling-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crawler:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./express-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # First time: install Docker if missing
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            # First time: clone repo if missing
            if [ ! -d "/opt/averto/.git" ]; then
              git clone https://github.com/muhammadyaqoobmuet/averto.git /opt/averto
            fi

            cd /opt/averto
            git pull origin main

            # Login to registry and deploy
            doctl registry login --expiry-seconds 600
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose run --rm backend npx prisma migrate deploy
            docker image prune -f
            