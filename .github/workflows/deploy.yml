name: Deploy to Azure

# Push to main = deploy. Nothing else triggers it.
on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing a no-op commit.
  workflow_dispatch:

# Never let two deploys race. If a push lands while one is running, queue it
# rather than cancelling — cancelling mid-build can leave the server in a
# half-updated state, which is far worse than waiting a few minutes.
concurrency:
  group: averto-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    # Whole job ceiling. The server-side build is ~4 min; 20 leaves room for a
    # slow runner or one extra rebuild during a rollback.
    timeout-minutes: 20

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_SSH_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          # Strict host checking, pinned to this VM's key. Without a
          # fingerprint, a DNS hijack or a rebuilt VM could silently become the
          # deploy target and receive your code. Get yours with:
          #   ssh-keyscan -t ed25519 104.214.186.193 | ssh-keygen -lf -
          fingerprint: ${{ secrets.AZURE_SSH_FINGERPRINT }}
          port: ${{ secrets.AZURE_SSH_PORT || 22 }}
          script: /usr/local/bin/averto-deploy
