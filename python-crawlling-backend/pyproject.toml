[project]
name = "python-crawlling-backend"
version = "0.1.0"
description = "FastAPI crawler service for ChatEmbed"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "crawl4ai>=0.4.247",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.10.4",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "trafilatura>=2.0.0",
    "readability-lxml>=0.8.1",
    "lxml>=5.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
